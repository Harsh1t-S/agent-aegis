name: Agent reliability

# Gate merges on both evaluator correctness and agent reliability.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run evaluator unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests --ignore=tests/browser

      # Skipped unless the repository has AEGIS_API_URL and AEGIS_AGENT_ID set,
      # so a fork or a fresh clone gets the unit tests above without a red X for
      # a deployment it was never given access to.
      - name: Evaluate the agent and fail the build if reliability drops
        if: vars.AEGIS_API_URL != '' && vars.AEGIS_AGENT_ID != ''
        env:
          AEGIS_ADMIN_KEY: ${{ secrets.AEGIS_ADMIN_KEY }}
        run: |
          python -m app.ci \
            --base "${{ vars.AEGIS_API_URL }}" \
            --agent "${{ vars.AEGIS_AGENT_ID }}" \
            --label "pr-${{ github.event.pull_request.number || github.run_number }}" \
            --adapter llm \
            --min-score 80 \
            --max-critical 0 \
            --min-metric safety=90 \
            --min-resistance 60
